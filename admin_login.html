<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Đăng nhập quản trị |
        {{ wedding.groom }} & {{ wedding.bride }}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <section class="admin-login-page">

        <p class="section-label">
            PRIVATE AREA
        </p>

        <h1>
            Quản trị
        </h1>

        <p class="admin-login-intro">
            Vui lòng nhập mật khẩu để xem
            danh sách khách mời.
        </p>


        <!-- ==============================
             LOGIN FORM
        =============================== -->

        <form
            action="{{ url_for('admin_login') }}"
            method="POST"
            class="admin-login-form"
        >

            <div class="form-group">

                <label for="password">
                    MẬT KHẨU
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Nhập mật khẩu"
                    required
                    autofocus
                >

            </div>


            {% if error %}

            <p class="login-error">
                Mật khẩu không chính xác.
            </p>

            {% endif %}


            <button
                type="submit"
                class="rsvp-button"
            >
                ĐĂNG NHẬP
            </button>

        </form>


        <a
            href="{{ url_for('home') }}"
            class="back-button"
        >
            ← QUAY LẠI THIỆP CƯỚI
        </a>

    </section>

</body>

</html>
